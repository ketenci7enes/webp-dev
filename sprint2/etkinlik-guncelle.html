<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2311012811.css">
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>
    <main>
        <form action="#" method="POST">
            <div>
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>
            </div>
            <div>
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="seminer" selected>Seminer ▾</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>
            <div>
                <label for="tarih">Tarih</label>
                <input type="text" id="tarih" name="tarih" value="12.10.2026" required>
            </div>
            <div>
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4" required>Mezun söyleşileri</textarea>
            </div>
            <button type="submit">Güncelle</button>
        </form>
    </main>
    <footer>
        <p>Mustafa Enes Ketenci &middot; 2311012811 &middot; 2026</p>
    </footer>
</body>
</html>
